  if(need>0)chosen.push(...shuffle(future).slice(0,need));
  T.items=chosen.slice(0,S.settings.daily||20).map(it=>({wi:it.wi,mi:it.mi,m:["meaning","context","word"][Math.floor(Math.random()*3)]}));
  T.pos=0;T.score=0;save();
}
function current(){return T.items[T.pos]}
function currentMeaning(){
  const w=S.deck[T.items[T.pos]?.wi];
  const mi=T.items[T.pos]?.mi||0;
  if(!w)return null;
  const ms=(w.meanings&&w.meanings.length?w.meanings:[{text:w.definition,cloze:null,synonyms:[]}]);
  return ms[mi]||ms[0];
}
function showSynonyms(){
  const m=currentMeaning();
  const box=document.getElementById("synonymBox");
  if(!box)return;
  const syns=(m?.synonyms||[]).filter(Boolean);
  box.innerHTML=syns.length
    ? `<b>Synonyms:</b> ${syns.map(x=>`<span class="synonym-chip">${esc(x)}</span>`).join("")}`
    : `<span class="muted">No synonyms added for this meaning.</span>`;
  box.style.display="block";
  if(typeof T.hintsUsed!=="number")T.hintsUsed=0;
  T.hintsUsed++; T.hintsUsedThisQuestion=true;
  persist();
}
function render(){
  if(!T.items.length||T.pos>=T.items.length)makeRound();
  const q=current(),x=S.deck[q.wi],m=(x.meanings||[])[q.mi]||{text:x.definition,cloze:null};
  let content, label, cls;
  if(q.m==="word"){
    label="Word → Meaning";content=x.word;cls="word";
  }else if(q.m==="context" && m.cloze){
    label="Context → Word";content=m.cloze;cls="prompt";
  }else{
    label="Meaning → Word";content=m.text;cls="prompt";
  }
  document.getElementById("game").innerHTML=`<div class="card">
    <div class="mode">${label} · ${T.pos+1}/${T.items.length}</div>
    <div class="${cls}">${content}</div>
    <div class="small">${q.m==="word"?"Explain the word in your own words.":"Type the word."}</div>
    ${q.m==="word"?'<textarea id="ans" placeholder="Your meaning"></textarea>':'<input id="ans" autocomplete="off" placeholder="Your answer">'}
    <div class="actions"><button class="primary" onclick="check()">Check</button><button class="secondary" onclick="reveal()">Reveal</button></div>
    <div id="fb"></div>
  </div>`;
  const a=document.getElementById("ans");a.focus();
  a.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();check()}};
  update();
}
function check(){
  const q=current(),x=S.deck[q.wi],m=x.meanings[q.mi]||{text:x.definition,cloze:null},a=document.getElementById("ans").value.trim();
  if(q.m==="word"){
    const s=semanticScore(a,m.text),edit=sim(a,m.text);
    if(edit>=.78||s>=.65){finish(true,false);return}
    if(edit<.25 && s<.25){finish(false,false);return}
    // Ambiguous paraphrases: let the learner self-grade after seeing the official meaning.
    showUncertain(a,m.text);
  }else{
    const s=sim(a,x.word);
    finish(s>=.78,false);
  }
}
function showUncertain(answer,meaning){
  const f=document.getElementById("fb");
  f.className="feedback warn";
  f.innerHTML=`<b>Check your meaning</b><br><br><span class="muted">Your answer:</span> ${answer||"(blank)"}<br><br><span class="muted">Card meaning:</span> ${meaning}<div class="actions"><button class="primary" onclick="finish(true,false)">I got it</button><button class="secondary" onclick="finish(false,false)">I missed it</button></div>`;
}
function reveal(){finish(false,true)}
function finish(ok,rev){
  const q=current(),x=S.deck[q.wi],m=x.meanings[q.mi]||{text:x.definition};
  rec(q.wi,q.mi,ok);if(ok)T.score++;save();
  const f=document.getElementById("fb");f.className="feedback "+(ok?"good":"bad");
  f.innerHTML=rev?`Answer: <span class="answer">${x.word}</span><br>${m.text}`:ok?`Correct! <span class="answer">${x.word}</span>`:`Answer: <span class="answer">${x.word}</span><br>${m.text}`;
  const b=document.querySelector(".primary");b.textContent=T.pos+1>=T.items.length?"Finish":"Next";
  b.onclick=()=>{if(T.pos+1>=T.items.length)done();else{T.hintsUsedThisQuestion=false; T.pos++;save();render()}};
  update();
}
function done(){
  document.getElementById("game").innerHTML=`<div class="card done"><div class="mode">Today's session</div><h2>${T.score}/${T.items.length}</h2><p>You completed today's ${T.items.length} questions.</p><button class="primary" onclick="T.items=[];T.pos=0;save();render()">Do another round</button></div>`;
}
function randomizeToday(){
  if(!T.items.length){makeRound();return}
  if(!confirm("Randomize today's set? Completed questions stay completed; the remaining questions are reshuffled."))return;
  const done=T.items.slice(0,T.pos);
  const remaining=shuffle(T.items.slice(T.pos));
  T.items=[...done,...remaining];
  persist();
  render();
}
function skip(){T.hintsUsedThisQuestion=false; T.pos++;save();render()}
function update(){
  const all=allItems(),m=all.filter(it=>cs(it.wi,it.mi).mastered).length,n=S.settings.daily||20;
  document.getElementById("today").textContent=Math.min(T.pos,n)+"/"+n;
  document.getElementById("mastered").textContent=m;
  document.getElementById("remaining").textContent=Math.max(0,all.length-m);
  document.getElementById("bar").style.width=(m/all.length*100)+"%";
  document.getElementById("label").textContent=all.length+" meanings · adaptive review";
}
function openStats(){
  const all=allItems(),a=Object.values(S.cards),m=all.filter(it=>cs(it.wi,it.mi).mastered).length,n=a.reduce((s,x)=>s+x.seen,0),ac=n?Math.round(a.reduce((s,x)=>s+x.ok,0)/n*100):0;
  openSheet(`<h2>Progress</h2>
  <div class="row"><span>Words</span><b>${S.deck.length}</b></div>
  <div class="row"><span>Distinct meanings</span><b>${all.length}</b></div>
  <div class="row"><span>Meanings mastered</span><b>${m}</b></div>
  <div class="row"><span>Overall accuracy</span><b>${ac}%</b></div>
  <div class="row"><span>Today's score</span><b>${T.score}/${T.pos}</b></div>
  <button class="primary" style="width:100%;margin-top:12px" onclick="openActivity()">📊 View daily / weekly / monthly activity</button>
  <p class="muted">Numbered meanings are learned separately. Definition answers can be reasonable paraphrases.</p>
  <button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`);
}
function activityEvents(){
  return (S.activity||[]).slice().sort((a,b)=>a.ts-b.ts);
}
function isoDate(d){return d.toISOString().slice(0,10)}
function startOfWeek(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  const day=x.getDay(); const diff=(day+6)%7; x.setDate(x.getDate()-diff); return x;
}
function activityAggregate(events,keyFn){
  const map={};
  events.forEach(e=>{const k=keyFn(e); if(!map[k])map[k]={questions:0,correct:0,words:new Set()}; map[k].questions++; if(e.ok)map[k].correct++; if(e.hint)map[k].hints=(map[k].hints||0)+1; map[k].words.add(e.wi);});
  return map;
}
function activityStats(events){
  const questions=events.length,correct=events.filter(e=>e.ok).length,words=new Set(events.map(e=>e.wi)).size;
  return {questions,correct,words,hints:events.filter(e=>e.hint).length,accuracy:questions?Math.round(correct/questions*100):0};
}
function renderActivity(period="days"){
  const events=activityEvents();
  const now=new Date();
  let labels=[],keys=[],keyFn;
  if(period==="days"){
    for(let i=13;i>=0;i--){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);labels.push(d.toLocaleDateString(undefined,{month:"short",day:"numeric"}));keys.push(isoDate(d));}
    keyFn=e=>e.date;
  }else if(period==="weeks"){
    const thisMon=startOfWeek(now);
    for(let i=11;i>=0;i--){const d=new Date(thisMon);d.setDate(d.getDate()-i*7);keys.push(isoDate(d));labels.push(d.toLocaleDateString(undefined,{month:"short",day:"numeric"}));}
    keyFn=e=>isoDate(startOfWeek(new Date(e.ts)));
  }else{
    for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));labels.push(d.toLocaleDateString(undefined,{month:"short",year:"2-digit"}));}
    keyFn=e=>e.date.slice(0,7);
  }
  const agg=activityAggregate(events,keyFn), rows=keys.map((k,i)=>({key:k,label:labels[i],...(agg[k]||{questions:0,correct:0,words:new Set()})}));
  const total=activityStats(events.filter(e=>{
    if(period==="days") return e.date>=keys[0];
    if(period==="weeks") return keys.includes(keyFn(e));
    return e.date.slice(0,7)>=keys[0];
  }));
  const max=Math.max(1,...rows.map(r=>r.questions));
  const chart=rows.map(r=>`<div class="activity-bar-wrap"><div class="activity-bar" title="${r.questions} questions" style="height:${Math.max(2,Math.round(r.questions/max*115))}px"></div><div class="activity-day">${r.label}</div></div>`).join("");
  const buttons=`<div class="activity-tabs">
    <button class="${period==="days"?"active":""}" onclick="openActivity('days')">Days</button>
    <button class="${period==="weeks"?"active":""}" onclick="openActivity('weeks')">Weeks</button>
    <button class="${period==="months"?"active":""}" onclick="openActivity('months')">Months</button>
  </div>`;
  const table=rows.slice().reverse().filter(r=>r.questions).map(r=>`<div class="row"><span>${r.label}</span><span><b>${r.words.size}</b> words · <b>${r.questions}</b> questions · <b>${r.correct}</b> correct · ${r.questions?Math.round(r.correct/r.questions*100):0}% · ${r.questions?Object.values(agg).find(x=>x===r)?.hints||0:0} hints</span></div>`).join("");
  openSheet(`<h2>Activity</h2>${buttons}
    <div class="activity-summary">
      <div class="activity-card"><b>${total.words}</b><span>unique words studied</span></div>
      <div class="activity-card"><b>${total.questions}</b><span>questions answered</span></div>
      <div class="activity-card"><b>${total.correct}</b><span>correct answers</span></div>
      <div class="activity-card"><b>${total.accuracy}%</b><span>accuracy</span></div>
      <div class="activity-card"><b>${total.hints}</b><span>synonym hints used</span></div>
    </div>
    <div class="activity-bars">${chart}</div>
    <div class="panel"><b>Breakdown</b>${table||'<p class="muted">No recorded activity in this period yet.</p>'}</div>
    <p class="muted">Activity tracking starts with this version. Older aggregate progress is retained, but past days cannot be reconstructed because earlier answers were not timestamped.</p>
    <button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`);
}
function openActivity(period="days"){renderActivity(period)}
function openDeck(){
  renderDeck();
}
function renderDeck(filter=""){
  const q=norm(filter);
  const words=S.deck.filter(x=>!q||norm(x.word).includes(q)||((x.meanings||[]).some(m=>norm(m.text||"").includes(q))));
  const totalMeanings=S.deck.reduce((n,x)=>n+(x.meanings?.length||1),0);
  const cards=words.map((x,i)=>{
    const meanings=(x.meanings&&x.meanings.length?x.meanings:[{text:x.definition,cloze:null}]);
    const meaningsHtml=meanings.map((m,j)=>`<div class="deck-meaning"><span class="deck-meaning-label">${meanings.length>1?`Meaning ${j+1}`:"Meaning"}</span><div>${esc(m.text||"")}</div>${m.cloze?`<div class="deck-sentence">"${esc(m.cloze)}"</div>`:""}${(m.synonyms||[]).length?`<div style="margin-top:5px"><b>Synonyms:</b> ${(m.synonyms||[]).map(x=>esc(x)).join(", ")}</div>`:""}</div>`).join("");
    return `<div class="deck-word"><div class="deck-word-head"><span class="deck-word-name">${esc(x.word)}</span><span class="muted">${meanings.length} meaning${meanings.length===1?"":"s"}</span></div>${meaningsHtml}</div>`;
  }).join("");
  openSheet(`<h2>📚 My Deck</h2>
    <input class="deck-search" id="deckSearch" placeholder="Search words or meanings..." value="${esc(filter)}" oninput="renderDeck(this.value)">
    <div class="deck-count">Showing ${words.length} of ${S.deck.length} words · ${totalMeanings} total meanings</div>
    <div class="deck-list">${cards||'<p class="muted">No matching words.</p>'}</div>
    <button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`);
}
function openSettings(){
  openSheet(`<h2>Manage deck</h2>
  <div class=panel><b>Add a word</b>
    <input id=newWord placeholder="Word">
    <div id=meaningRows></div>
    <button class="secondary add-meaning" onclick="addMeaningRow()">＋ Add another meaning</button>
    <button class=primary style="width:100%;margin-top:10px" onclick="addWord()">Add word</button>
  </div>
  <div class=panel><b>Import CSV</b><p class=muted>CSV format: <b>Word,Meaning</b>. Existing words are preserved; new words are added.</p><input class=file type=file accept=".csv,text/csv" onchange="importCSV(event)"></div>
  <div class=panel><b>Daily questions</b><input id=daily type=number min=5 max=50 value="${S.settings.daily}"><button class=secondary style="width:100%;margin-top:10px" onclick="setDaily()">Save daily count</button></div>
  <div class=panel><b>Progress backup</b><p class=muted>Export a backup if you are using the local HTML file.</p>
    <div class="actions"><button class=secondary onclick="exportProgress()">Export</button><button class=secondary onclick="document.getElementById('progressFile').click()">Import</button></div>
    <input id=progressFile class=file type=file accept=".json,application/json" style="display:none" onchange="importProgress(event)">
  </div>
  <div class=panel><b>Storage</b><p class=muted id=storageStatus>Checking…</p></div>
  <button class=secondary style="width:100%;margin-top:12px" onclick="closeModal()">Close</button>`);
  addMeaningRow();
}
function addMeaningRow(){
  const box=document.getElementById("meaningRows"); if(!box)return;
  const n=box.children.length+1;
  const row=document.createElement("div");
  row.className="meaning-row";
  row.dataset.n=n;
  row.innerHTML=`<div class="meaning-head"><span class="meaning-num">Meaning ${n}</span>${n>1?'<button class="secondary remove-meaning" onclick="this.closest(\\'.meaning-row\\').remove();renumberMeaningRows()">Remove</button>':''}</div>
    <textarea class="meaning-input" placeholder="Meaning"></textarea>
    <input class="sentence-input" placeholder="Sample sentence (optional)">
    <input class="synonym-input" placeholder="Synonyms (optional, comma separated)">`;
  box.appendChild(row);
}
function renumberMeaningRows(){
  [...document.querySelectorAll("#meaningRows .meaning-row")].forEach((r,i)=>{
    r.dataset.n=i+1;
    r.querySelector(".meaning-num").textContent="Meaning "+(i+1);
    const btn=r.querySelector(".remove-meaning");
    if(btn)btn.style.display=i===0?"none":"inline-block";
  });
}
function openSheet(x){document.getElementById("sheet").innerHTML=x;document.getElementById("modal").className="modal show";setTimeout(storageCheck,50)}
function closeModal(){document.getElementById("modal").className="modal"}
function addWord(){
  const w=document.getElementById("newWord").value.trim();
  const rows=[...document.querySelectorAll("#meaningRows .meaning-row")];
  const meanings=rows.map(r=>({
    text:r.querySelector(".meaning-input").value.trim(),
    cloze:r.querySelector(".sentence-input").value.trim()||null,
    synonyms:r.querySelector(".synonym-input").value.split(",").map(x=>x.trim()).filter(Boolean)
  })).filter(m=>m.text);
  if(!w)return alert("Enter the word.");
  if(!meanings.length)return alert("Enter at least one meaning.");
  if(S.deck.some(x=>norm(x.word)===norm(w)))return alert("That word is already in the deck.");
  S.deck.push({word:w,definition:meanings[0].text,meanings});
  save();openSettings();update();
}
function parseCSV(t){
  const lines=t.split(/\r?\n/).filter(Boolean),out=[];
  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(/^\s*(?:"([^"]*(?:""[^"]*)*)"|([^,]*))\s*,\s*(?:"([^"]*(?:""[^"]*)*)"|(.*))\s*$/);
    if(m){const w=(m[1]??m[2]??"").replace(/""/g,'"').trim(),d=(m[3]??m[4]??"").replace(/""/g,'"').trim();if(w&&d&&!(i===0&&/word/i.test(w)))out.push({word:w,definition:d,meanings:[{text:d,cloze:null}]})}
  }return out;
}
function importCSV(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const incoming=parseCSV(r.result);let added=0;incoming.forEach(x=>{if(!S.deck.some(y=>norm(y.word)===norm(x.word))){S.deck.push(x);added++}});save();alert("Added "+added+" new words.");openSettings();update()};r.readAsText(f);
}
function exportProgress(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vocab-trainer-progress.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importProgress(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!x.deck||!x.cards||!x.days)throw new Error();
      if(!confirm("Replace current deck and progress with this backup?"))return;
      S=x;D=TODAY();if(!S.days[D])S.days[D]={items:[],pos:0,score:0}; if(!S.activity)S.activity=[]; T=S.days[D];
      persist();alert("Backup restored.");closeModal();render();
    }catch(e){alert("Invalid Vocab Trainer backup.")}
  };
  r.readAsText(f);
}
function storageCheck(){
  const el=document.getElementById("storageStatus");if(!el)return;
  if(location.protocol==="file:"||location.protocol==="content:"){
    el.textContent="Local/content-file mode detected. Chrome may not give this file a stable storage origin when reopened from Downloads. For guaranteed persistence, use a hosted version or Export a backup.";
  }else{
    el.textContent="Progress is stored in this browser on this device.";
  }
}
function setDaily(){const n=Math.max(5,Math.min(50,parseInt(document.getElementById("daily").value)||20));S.settings.daily=n;save();alert("Daily target set to "+n+".");closeModal();update()}
(async function(){
  try{
    const db=await openDB();

      const tx=db.transaction("state","readonly"),r=tx.objectStore("state").get(KEY);
      r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);

    if(raw){S=JSON.parse(raw);D=TODAY();if(!S.days[D])S.days[D]={items:[],pos:0,score:0}; if(!S.activity)S.activity=[]; T=S.days[D];}
  }catch(e){}
